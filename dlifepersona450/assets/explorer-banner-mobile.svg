    <linearGradient id="portal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c8e0eb"/><stop offset="1" stop-color="#5f8cac"/></linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bd834b"/><stop offset="1" stop-color="#d8a85d"/></linearGradient>
    <clipPath id="frame"><rect width="700" height="700" rx="20"/></clipPath>
    <clipPath id="portal-window"><circle cx="451" cy="441" r="114"/></clipPath>
  </defs>
