<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700" role="img" aria-labelledby="mobile-title mobile-description">
  <title id="mobile-title">DLife — a curious person, an open horizon</title>
  <desc id="mobile-description">An original square composition for narrow screens. Large DLife lettering and an exploration motto sit above an anonymous explorer, warm ochre ridges, and a luminous blue portal.</desc>
