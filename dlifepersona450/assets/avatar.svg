    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6bb6a"/><stop offset="1" stop-color="#b87b3e"/></linearGradient>
    <clipPath id="portal-window"><circle cx="512" cy="468" r="336"/></clipPath>
  </defs>
